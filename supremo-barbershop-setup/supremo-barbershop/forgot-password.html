<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — Supremo Barbershop</title>
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <img class="logo-mark" src="img/logo.jpg" alt="Supremo Barbershop logo">
      <div><div class="brand-name" data-shop-name>Supremo Barbershop</div></div>
    </a>
    <div class="header-actions">
      <a class="btn ghost" href="login.html">Back to log in</a>
    </div>
  </div>
</header>

<main class="auth-page">
  <div class="auth-box">
    <div class="card">
      <h2>Reset password</h2>
      <p class="muted lead">Answer the security question you chose when you registered.</p>

      <form id="resetForm" novalidate>
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="username or email">

        <label for="fullName">Full name</label>
        <input id="fullName" type="text" placeholder="Must match what is on record">

        <label for="secQ">Security question</label>
        <select id="secQ">
          <option value="">-- Choose a security question --</option>
          <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
          <option value="What was your first pet's name?">What was your first pet's name?</option>
          <option value="In what city were you born?">In what city were you born?</option>
          <option value="What is your favorite movie?">What is your favorite movie?</option>
          <option value="What was your high school name?">What was your high school name?</option>
        </select>

        <label for="secA">Answer</label>
        <input id="secA" type="text" placeholder="Your answer">

        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password">
        <div class="field-hint">At least 8 characters, with a letter and a number.</div>

        <div class="form-actions">
          <button class="btn block" id="resetBtn" type="submit">Reset password</button>
        </div>
        <div id="resetMsg" class="msg"></div>
      </form>

      <div class="auth-foot">
        Remembered it? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script>
loadShopName();

var resetForm = document.getElementById("resetForm");
var resetMsg = document.getElementById("resetMsg");
var resetBtn = document.getElementById("resetBtn");


resetForm.onsubmit = async function (event) {
  event.preventDefault();

  var username = document.getElementById("username").value.trim();
  var fullName = document.getElementById("fullName").value.trim();
  var question = document.getElementById("secQ").value;
  var answer = document.getElementById("secA").value.trim();
  var newPassword = document.getElementById("newPassword").value;

  if (username == "" || fullName == "" || question == "" || answer == "" || newPassword == "") {
    setMsg(resetMsg, "Please fill in all fields and choose a security question.", "error");
    return;
  }

  var problem = passwordProblem(newPassword);
  if (problem != "") {
    setMsg(resetMsg, problem, "error");
    return;
  }

  resetBtn.disabled = true;
  setMsg(resetMsg, "Resetting password...");

  try {
    // Dapat tugma lahat: username, pangalan, tanong, at sagot.
    var result = await runServer("resetPassword", username, fullName, newPassword, question, answer);

    if (result.success) {
      setMsg(resetMsg, "Your password has been reset. Taking you to the login page...", "ok");

      setTimeout(function () {
        window.location.replace("login.html");
      }, 1500);
    } else {
      setMsg(resetMsg, result.message || "The information you entered does not match.", "error");
      resetBtn.disabled = false;
    }
  } catch (error) {
    showError(resetMsg, error);
    resetBtn.disabled = false;
  }
};
</script>
</body>
</html>
